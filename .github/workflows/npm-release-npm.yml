# Manual npm release for @osva-ai/connector-npm.
# Does NOT run on push or pull_request. Requires operator workflow_dispatch.
#
# First public @0.1.0: manual bootstrap only (maintainer laptop, npm login) — see docs/RELEASE-CHECKLIST-NPM.md.
# This workflow must not upload a version that already exists on the registry (immutable).
#
# Prerequisites (configure outside this repository, after manual bootstrap):
# - npm package @osva-ai/connector-npm exists on the registry with public access
# - npm Trusted Publisher for GitHub Actions OIDC (recommended):
#     Osva-AI / osva-connectors / workflow npm-release-npm.yml / environment npm
#   OR NPM_TOKEN in GitHub Environment "npm" (fallback — avoid when OIDC is available)
# - GitHub Environment "npm" with required reviewers (must match workflow `environment:` below)
#
# Independent from other npm-release-*.yml workflows.

name: Release npm registry connector to npm

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Must match packages/npm/package.json version (upload only for a semver not yet on npm)
        required: true
        default: "0.1.0"
      dry_run:
        description: When true, validate and run npm publish --dry-run only (no registry upload; safe after bootstrap)
        type: boolean
        default: true
      confirm_publish:
        description: When true and dry_run is false, upload a new semver to npm (requires environment npm approval; never republishes)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Verify and publish @osva-ai/connector-npm
    runs-on: ubuntu-24.04
    environment: npm
    defaults:
      run:
        working-directory: packages/npm

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify branch
        working-directory: .
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Release workflow must run from main (got ${{ github.ref }})."
            exit 1
          fi

      - name: Verify clean working tree
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is not clean; refusing to release."
            git status --porcelain
            exit 1
          fi

      - name: Verify package name, version, and CONNECTOR_VERSION
        run: |
          node <<'EOF'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const constants = fs.readFileSync("src/constants.ts", "utf8");
          const expected = process.env.EXPECTED_VERSION;
          if (pkg.name !== "@osva-ai/connector-npm") {
            console.error(`Unexpected package name: ${pkg.name}`);
            process.exit(1);
          }
          if (pkg.version !== expected) {
            console.error(`Version mismatch: package.json=${pkg.version} expected=${expected}`);
            process.exit(1);
          }
          const match = constants.match(/export const CONNECTOR_VERSION = "([^"]+)"/);
          if (!match || match[1] !== expected) {
            console.error(`CONNECTOR_VERSION mismatch: constants=${match?.[1] ?? "missing"} expected=${expected}`);
            process.exit(1);
          }
          if (pkg.dependencies?.["@osva-ai/connector-sdk"] !== "1.1.3") {
            console.error(`Unexpected connector-sdk pin: ${pkg.dependencies?.["@osva-ai/connector-sdk"]}`);
            process.exit(1);
          }
          console.log(`Release target: ${pkg.name}@${pkg.version}`);
          EOF
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Refuse upload when version already on npm
        if: inputs.dry_run == false && inputs.confirm_publish == true
        run: |
          if npm view "@osva-ai/connector-npm@${{ inputs.expected_version }}" version 2>/dev/null; then
            echo "::error::@osva-ai/connector-npm@${{ inputs.expected_version }} is already on the registry (immutable)."
            echo "Do not republish. First public 0.1.0 is manual bootstrap only (see docs/RELEASE-CHECKLIST-NPM.md)."
            echo "For OIDC upload, bump packages/npm/package.json and CONNECTOR_VERSION, then re-run with the new expected_version."
            echo "Use dry_run=true to validate packaging without uploading."
            exit 1
          fi
          echo "Version ${{ inputs.expected_version }} is not on npm (ok to upload)."

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: .
        run: pnpm format:check

      - name: Lint and typecheck (npm connector package)
        working-directory: .
        run: pnpm --filter @osva-ai/connector-npm lint && pnpm --filter @osva-ai/connector-npm typecheck

      - name: Build and test (npm connector package)
        working-directory: .
        run: |
          pnpm --filter @osva-ai/connector-npm build
          pnpm --filter @osva-ai/connector-npm test

      - name: Package boundaries
        working-directory: .
        run: pnpm verify:boundaries

      - name: Packaged npm connector acceptance
        working-directory: .
        run: pnpm test:package-acceptance:npm

      - name: Validate tarball contents
        run: |
          pnpm pack --pack-destination "${{ runner.temp }}/pack"
          TARBALL=$(ls "${{ runner.temp }}/pack"/*.tgz | head -1)
          echo "Inspecting ${TARBALL}"
          tar -tzf "${TARBALL}" | tee "${{ runner.temp }}/tar-list.txt"
          if grep -E 'package/(test/|\.env)' "${{ runner.temp }}/tar-list.txt"; then
            echo "Forbidden paths in tarball."
            exit 1
          fi
          grep -q 'package/dist/stdio.js' "${{ runner.temp }}/tar-list.txt"
          grep -q 'package/LICENSE' "${{ runner.temp }}/tar-list.txt"
          TARBALL="${TARBALL}" node <<'EOF'
          import { spawnSync } from "node:child_process";
          const tarball = process.env.TARBALL;
          const manifestRaw = spawnSync("tar", ["-xOf", tarball, "package/package.json"], {
            encoding: "utf8",
          });
          if (manifestRaw.status !== 0) {
            console.error(manifestRaw.stderr);
            process.exit(1);
          }
          const manifest = JSON.parse(manifestRaw.stdout);
          if (manifest.bin?.["osva-connector-npm"] !== "dist/stdio.js") {
            console.error(`Unexpected bin map: ${JSON.stringify(manifest.bin)}`);
            process.exit(1);
          }
          console.log("Packed manifest bin verified.");
          EOF

      - name: Ensure npm CLI 11.5.1+ for OIDC trusted publishing
        run: |
          echo "node $(node -v)"
          npm install -g npm@11.5.1
          NPM_VER="$(npm -v)"
          echo "npm ${NPM_VER}"
          export NPM_VER
          node -e "const p=process.env.NPM_VER.split('.').map(Number);const ok=p[0]>11||(p[0]===11&&p[1]>5)||(p[0]===11&&p[1]===5&&p[2]>=1);if(!ok){console.error('npm 11.5.1+ required for OIDC trusted publishing');process.exit(1)}"

      - name: npm publish (dry run)
        if: inputs.dry_run == true
        run: npm publish --dry-run --access public --provenance=false

      # OIDC: with Trusted Publisher configured, npm uses GitHub OIDC (permissions.id-token write, environment npm).
      # Fallback: NPM_TOKEN secret on GitHub Environment "npm" when OIDC is not configured.
      - name: npm publish
        if: inputs.dry_run == false && inputs.confirm_publish == true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Refuse publish without confirmation
        if: inputs.dry_run == false && inputs.confirm_publish != true
        run: |
          echo "Refusing upload: set dry_run=true for validation-only, or confirm_publish=true after review."
          exit 1
