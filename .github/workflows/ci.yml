name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build connectors
        run: pnpm build

      - name: Build test stdio fixture
        run: pnpm --filter @osva-ai/connector-github build:test-stdio-fixture

      - name: Test
        run: pnpm test

      - name: Package boundaries
        run: pnpm verify:boundaries

      - name: Package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance

      - name: Shopify package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance:shopify

      - name: GA4 package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance:ga4

      - name: GSC package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance:gsc

      - name: Slack package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance:slack

      - name: Google Drive package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance:google-drive

      - name: Google Sheets package acceptance (tarball install + MCP smoke)
        run: pnpm test:package-acceptance:google-sheets

      - name: Packaged Google Ads acceptance
        run: pnpm test:package-acceptance:google-ads

      - name: Packaged Meta Ads acceptance
        run: pnpm test:package-acceptance:meta-ads

      - name: Packaged Klaviyo acceptance
        run: pnpm test:package-acceptance:klaviyo

      - name: Packaged WhatsApp acceptance
        run: pnpm test:package-acceptance:whatsapp

      - name: Packaged HubSpot acceptance
        run: pnpm test:package-acceptance:hubspot

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 16 fixture
        run: docker compose -f packages/postgres/docker/integration-compose.yml up -d --wait

      - name: Packaged PostgreSQL acceptance (tarball install + MCP)
        env:
          OSVA_CONNECTOR_POSTGRES_INTEGRATION_URL: postgresql://osva_reader:reader_pass@127.0.0.1:55432/osva_integration
        run: pnpm test:package-acceptance:postgres

      - name: Run PostgreSQL integration tests
        env:
          OSVA_CONNECTOR_POSTGRES_INTEGRATION_URL: postgresql://osva_reader:reader_pass@127.0.0.1:55432/osva_integration
          OSVA_CONNECTOR_POSTGRES_WRITER_INTEGRATION_URL: postgresql://osva_writer:writer_pass@127.0.0.1:55432/osva_integration
        run: pnpm --filter @osva-ai/connector-postgres test -- test/postgres-discovery.integration.test.ts test/postgres-query-read.integration.test.ts test/postgres-read-only-transaction.integration.test.ts test/postgres-reliability.integration.test.ts

      - name: Stop PostgreSQL fixture
        if: always()
        run: docker compose -f packages/postgres/docker/integration-compose.yml down -v
