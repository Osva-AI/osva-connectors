# Manual npm release for @osva-ai/connector-pinecone.
# Does NOT run on push or pull_request. Requires operator workflow_dispatch.
#
# Prerequisites (configure outside this repository):
# - npm package @osva-ai/connector-pinecone with public access (bootstrap once — see docs/RELEASE-CHECKLIST-GMAIL.md)
# - npm trusted publisher for GitHub Actions OIDC (recommended), OR
#   NPM_TOKEN in GitHub Environment "npm" (fallback)
# - GitHub Environment "npm" with required reviewers
#
# Independent from other connector release workflows.

name: Release pinecone to npm

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Must match packages/pinecone/package.json version
        required: true
        default: "0.1.0"
      dry_run:
        description: When true, run npm publish --dry-run only (no registry upload)
        type: boolean
        default: true
      confirm_publish:
        description: When true and dry_run is false, upload to npm (requires npm environment approval)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Verify and publish @osva-ai/connector-pinecone
    runs-on: ubuntu-24.04
    environment: npm
    defaults:
      run:
        working-directory: packages/pinecone

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify branch
        working-directory: .
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Release workflow must run from main (got ${{ github.ref }})."
            exit 1
          fi

      - name: Verify clean working tree
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is not clean; refusing to release."
            git status --porcelain
            exit 1
          fi

      - name: Verify package name, version, and CONNECTOR_VERSION
        run: |
          node <<'EOF'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const constants = fs.readFileSync("src/constants.ts", "utf8");
          const expected = process.env.EXPECTED_VERSION;
          if (pkg.name !== "@osva-ai/connector-pinecone") {
            console.error(`Unexpected package name: ${pkg.name}`);
            process.exit(1);
          }
          if (pkg.version !== expected) {
            console.error(`Version mismatch: package.json=${pkg.version} expected=${expected}`);
            process.exit(1);
          }
          const match = constants.match(/export const CONNECTOR_VERSION = "([^"]+)"/);
          if (!match || match[1] !== expected) {
            console.error(`CONNECTOR_VERSION mismatch: constants=${match?.[1] ?? "missing"} expected=${expected}`);
            process.exit(1);
          }
          console.log(`Release target: ${pkg.name}@${pkg.version}`);
          EOF
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: .
        run: pnpm format:check

      - name: Lint and typecheck (pinecone package)
        working-directory: .
        run: pnpm --filter @osva-ai/connector-pinecone lint && pnpm --filter @osva-ai/connector-pinecone typecheck

      - name: Build and test (pinecone package)
        working-directory: .
        run: |
          pnpm --filter @osva-ai/connector-pinecone build
          pnpm --filter @osva-ai/connector-pinecone test

      - name: Package boundaries
        working-directory: .
        run: pnpm verify:boundaries

      - name: Packaged pinecone acceptance
        working-directory: .
        run: pnpm test:package-acceptance:pinecone

      - name: Check npm for existing version (publish only)
        if: inputs.dry_run == false && inputs.confirm_publish == true
        run: |
          if npm view "@osva-ai/connector-pinecone@${{ inputs.expected_version }}" version 2>/dev/null; then
            echo "Version ${{ inputs.expected_version }} is already published; aborting upload."
            exit 1
          fi
          echo "Version ${{ inputs.expected_version }} is not published (ok to upload)."

      - name: Validate tarball contents
        run: |
          pnpm pack --pack-destination "${{ runner.temp }}/pack"
          TARBALL=$(ls "${{ runner.temp }}/pack"/*.tgz | head -1)
          echo "Inspecting ${TARBALL}"
          tar -tzf "${TARBALL}" | tee "${{ runner.temp }}/tar-list.txt"
          if grep -E 'package/(test/|\.env)' "${{ runner.temp }}/tar-list.txt"; then
            echo "Forbidden paths in tarball."
            exit 1
          fi
          grep -q 'package/dist/stdio.js' "${{ runner.temp }}/tar-list.txt"
          grep -q 'package/LICENSE' "${{ runner.temp }}/tar-list.txt"
          TARBALL="${TARBALL}" node <<'EOF'
          import { spawnSync } from "node:child_process";
          const tarball = process.env.TARBALL;
          const manifestRaw = spawnSync("tar", ["-xOf", tarball, "package/package.json"], {
            encoding: "utf8",
          });
          if (manifestRaw.status !== 0) {
            console.error(manifestRaw.stderr);
            process.exit(1);
          }
          const manifest = JSON.parse(manifestRaw.stdout);
          if (manifest.bin?.["osva-connector-pinecone"] !== "dist/stdio.js") {
            console.error(`Unexpected bin map: ${JSON.stringify(manifest.bin)}`);
            process.exit(1);
          }
          console.log("Packed manifest bin verified.");
          EOF

      - name: Ensure npm CLI 11.5.1+ for OIDC trusted publishing
        run: |
          echo "node $(node -v)"
          npm install -g npm@11.5.1
          NPM_VER="$(npm -v)"
          echo "npm ${NPM_VER}"
          export NPM_VER
          node -e "const p=process.env.NPM_VER.split('.').map(Number);const ok=p[0]>11||(p[0]===11&&p[1]>5)||(p[0]===11&&p[1]===5&&p[2]>=1);if(!ok){console.error('npm 11.5.1+ required for OIDC trusted publishing');process.exit(1)}"

      - name: npm publish (dry run)
        if: inputs.dry_run == true
        run: npm publish --dry-run --access public --provenance=false

      - name: Configure npm authentication for publish
        if: inputs.dry_run == false && inputs.confirm_publish == true
        run: |
          set -euo pipefail
          NPMRC="$(npm config get userconfig)"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publish authentication: NPM_TOKEN fallback"
            if [ ! -f "${NPMRC}" ]; then
              echo "Expected setup-node to create userconfig npmrc."
              exit 1
            fi
            if ! grep -qE '^//registry\.npmjs\.org/:_authToken=' "${NPMRC}"; then
              echo "Expected //registry.npmjs.org/:_authToken entry in npmrc for token fallback."
              exit 1
            fi
            echo "Token authentication path validated."
          else
            echo "Publish authentication: OIDC trusted publishing"
            if [ -f "${NPMRC}" ]; then
              sed -i -E '/^\/\/registry\.npmjs\.org\/:_authToken=/d' "${NPMRC}"
              sed -i -E '/^always-auth=true$/d' "${NPMRC}"
            fi
            if [ -f "${NPMRC}" ] && grep -qE '^//registry\.npmjs\.org/:_authToken=' "${NPMRC}"; then
              echo "Registry _authToken entry still present; OIDC trusted publishing would be blocked."
              exit 1
            fi
            echo "OIDC authentication path validated (no empty registry _authToken placeholder)."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: npm publish
        if: inputs.dry_run == false && inputs.confirm_publish == true
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          else
            unset NODE_AUTH_TOKEN
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Refuse publish without confirmation
        if: inputs.dry_run == false && inputs.confirm_publish != true
        run: |
          echo "Refusing upload: set dry_run=true for validation-only, or confirm_publish=true after review."
          exit 1
